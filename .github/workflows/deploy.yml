# GitHub Pages 배포 워크플로우
# - main 브랜치 push(또는 수동 실행) 시 Node로 앱을 빌드하고 GitHub Pages에 배포
# - 서비스 도메인: gongzip.developerlog.xyz (dist/CNAME 으로 지정)
# - Supabase 연결 키는 GitHub Secrets(VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY)에서 주입
# - dist 는 리포에 커밋하지 않고 CI 에서 생성

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 같은 그룹의 배포는 취소하고 하나만 실행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}

      - name: Prepare static site (SPA fallback + custom domain)
        run: |
          cp public/404.html dist/404.html
          echo "gongzip.developerlog.xyz" > dist/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
