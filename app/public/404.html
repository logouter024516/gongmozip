<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>공모집으로 이동 중</title>
    <script>
      // GitHub Pages SPA 폴백
      // BrowserRouter 직접 URL(예: /records) 접근 시 index.html로 리디렉트해서
      // React 라우터가 경로를 다시 처리하게 한다.
      (function () {
        var l = window.location
        l.replace(
          l.protocol + '//' + (l.hostname || '') + (l.port ? ':' + l.port : '') + '/' +
          l.pathname.split('/').slice(1).join('/') + l.search
        )
      })()
    </script>
  </head>
  <body>
    <p>페이지로 이동 중입니다…</p>
  </body>
</html>
