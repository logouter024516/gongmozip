<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Concept 3A: Flat Multi-Color Isometric Hex Cube (No Gradient) -->
  <g transform="translate(0, 0)">
    <!-- Top Face (Cyan) -->
    <polygon points="256,64 416,156 256,248 96,156" fill="#00C6FF"/>
    
    <!-- Left Face ('ㄱ' shape in #060C7F Navy) -->
    <polygon points="86,176 246,268 246,448 86,356" fill="#060C7F"/>
    
    <!-- Right Face ('ㄷ' shape in #2563EB Royal Blue) -->
    <polygon points="266,268 426,176 426,356 266,448" fill="#2563EB"/>

    <!-- Inner Floating Tech Core (Vibrant Amber / Mint) -->
    <!-- Floating Sub-cube / Nodes in Flat Solid -->
    <polygon points="256,190 310,221 256,252 202,221" fill="#FDE047"/>
    <polygon points="202,227 252,256 252,316 202,287" fill="#F59E0B"/>
    <polygon points="260,256 310,227 310,287 260,316" fill="#D97706"/>
    
    <!-- Corner Tech Nodes -->
    <circle cx="256" cy="64" r="14" fill="#38BDF8"/>
    <circle cx="416" cy="156" r="14" fill="#60A5FA"/>
    <circle cx="96" cy="156" r="14" fill="#3B82F6"/>
    <circle cx="86" cy="356" r="14" fill="#1E3A8A"/>
    <circle cx="426" cy="356" r="14" fill="#1D4ED8"/>
    <circle cx="256" cy="448" r="14" fill="#F59E0B"/>
  </g>
</svg>